id: crawl_challenge
name: Crawl Challenge
tagline: Navigate tight spaces to reach goal.
tags:
  - Mobility
objective: Build a creature that crawls to the goal.
reward: crawl_locomotion
default_world: hill_path
required_tools:
  - create_body
  - add_joint
  - add_motor
  - run_simulation
recommended_tools:
  - set_friction
  - set_density
  - inspect_score
goal:
  threshold_x: 6.0
# Starting world: a body "seed" the agent should turn into a crawling creature
# (add joints + motors), plus a goal marker at the threshold line. The seed body
# is dynamic, so the world simulates immediately.
scaffold:
  - id: start_marker
    shape: box
    kind: wall
    position: [-6.6, 0.4]
    size: [0.18, 0.8]
    static: true
    color: "#94a3b8"
  - id: torso
    shape: box
    kind: torso
    position: [-5.0, 1.5]
    size: [1.4, 0.6]
    mass: 1.5
    material: rubber
    color: "#6d28d9"
  - id: belly_clearance_bar
    shape: box
    kind: beam
    position: [-1.0, 0.7]
    size: [3.0, 0.16]
    static: true
    color: "#64748b"
  - id: goal_marker
    shape: box
    kind: goal
    position: [6.0, 1.2]
    size: [0.4, 1.6]
    static: true
    sensor: true  # a flag, not a wall — must not block the creature reaching it
    color: "#22c55e"
