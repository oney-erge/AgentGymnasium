id: bridge_builder
name: Bridge Builder
tagline: Transport the crate to the goal.
tags:
  - Construction
  - Transport
objective: >-
  The round crate starts high on the left slope and rolls down on its own,
  off the end of the slope at roughly x=-4. From there it is over open air —
  there is NO floor between x=-10.5 and x=2, a real ravine — so an unaided
  crate falls straight through and the attempt fails. Build a bridge across
  the gap (add_beam + add_joint) so the crate is carried to the goal platform
  on the right cliff at x=8. Do NOT build on top of or beside the crate's
  start — leave its slope clear.
reward: bridge_transport
default_world: island_cliff_small
required_tools:
  - create_body
  - add_beam
  - add_joint
  - run_simulation
recommended_tools:
  - add_ramp
  - set_material
  - inspect_score
goal:
  goal_x: 8.0
# Starting world: a round crate at the top of the left slope (the island_cliff
# world provides the slope, pillar, and lower goal cliff) and a goal marker on the
# right cliff. The crate rolls down the slope on its own; the agent must bridge
# the gap so it carries across to the goal at x=8. The crate is dynamic, so the
# world always simulates even before the agent adds anything.
scaffold:
  - id: crate
    kind: crate
    shape: circle
    position: [-12.0, 7.5]
    size: [0.6]
    mass: 2.0
    material: wood
    color: "#d2691e"
  - id: gap_water
    shape: box
    kind: water
    position: [-1.0, 0.12]
    size: [7.0, 0.24]
    static: true
    sensor: true  # visual hazard only — must not become a hidden floor
    color: "#2563eb"
  - id: left_bridge_anchor
    shape: box
    kind: wall
    position: [-4.4, 1.35]
    size: [0.35, 1.1]
    static: true
    material: concrete
    color: "#737373"
  - id: right_bridge_anchor
    shape: box
    kind: wall
    position: [2.7, 1.35]
    size: [0.35, 1.1]
    static: true
    material: concrete
    color: "#737373"
  - id: goal_marker
    shape: box
    kind: goal
    position: [8.0, 2.3]
    size: [0.6, 1.6]
    static: true
    sensor: true  # a flag, not a wall — must not block the crate reaching it
    color: "#22c55e"
