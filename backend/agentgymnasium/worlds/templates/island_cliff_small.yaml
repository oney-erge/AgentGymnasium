id: island_cliff_small
name: Island Cliff (Small)
terrain: grassland
map_size:
  - 32
  - 32
gravity: -9.81
active_physics_zones: 3
description: A high sloped ledge on the left and a lower goal cliff on the right, split by a real gap to bridge.
# The floor is real ground only under the two cliffs — nothing supports a body
# between x=-10.5 and x=2 (the ravine the slope ends over). Without an
# agent-built bridge, anything that ends up over that stretch keeps falling.
ground_spans:
  - [-16.0, -10.5]
  - [2.0, 16.0]
kill_y: -4.0
static_bodies:
  # A downhill ramp on the left: the crate rolls down it toward the gap.
  - id: left_slope
    shape: segment
    kind: ramp
    position: [-9.0, 4.0]
    size: [10.0]
    angle: -0.4
    static: true
    material: concrete
    color: "#6b7280"
  # A pillar holding the high end of the slope up (visual mass).
  - id: left_pillar
    shape: box
    kind: wall
    position: [-12.0, 2.5]
    size: [3.0, 5.0]
    static: true
    material: concrete
    color: "#4b5563"
  # The lower goal cliff on the right, across the gap.
  - id: right_cliff
    shape: box
    kind: wall
    position: [8.0, 0.75]
    size: [12.0, 1.5]
    static: true
    material: concrete
    color: "#6b7280"
  # A low guard ridge at the cliff's far right edge: without it a low-friction
  # rolling ball that clears the gap never stops and rolls clean off the far
  # side of the cliff into the void, which reads as a bug, not a win.
  - id: cliff_end_ridge
    shape: box
    kind: wall
    position: [13.5, 2.0]
    size: [0.4, 1.0]
    static: true
    material: concrete
    color: "#6b7280"
