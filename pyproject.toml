[project]
name = "agentgymnasium"
version = "0.1.0"
description = "Visual AI physics sandbox where agents build objects in simulated worlds"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.5",
    "pymunk>=7.3.0",
    "httpx>=0.27",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
]

[project.scripts]
agentgymnasium = "agentgymnasium.cli:main"
agentarium = "agentgymnasium.cli:main"  # the project's former name, kept so existing commands still work

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/agentgymnasium"]

[tool.ruff]
line-length = 100
src = ["backend"]
exclude = ["backend/agentgymnasium/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.9",
    "httpx>=0.27",
    # Browser UI diagnosis: after installing, run: python -m playwright install chromium
    "playwright>=1.63.0",
]
