services:
  agentgymnasium:
    build: .
    image: agentgymnasium:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENTGYMNASIUM_PORT:-${AGENTARIUM_PORT:-8765}}:8765"
    volumes:
      - agentgymnasium-runs:/app/runs
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AGENTGYMNASIUM_LLM_BASE_URL: ${AGENTGYMNASIUM_LLM_BASE_URL:-${AGENTARIUM_LLM_BASE_URL:-}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  agentgymnasium-runs:
