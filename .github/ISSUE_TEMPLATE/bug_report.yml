name: Bug report
description: Something in AgentGymnasium does not work as described.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options:
        - Launcher (run.bat, run.sh, or run.command)
        - Docker
        - Source checkout (uv run agentgymnasium serve)
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it fail?
      options:
        - Simulation Setup
        - Studio (replay)
        - History, Compare, or Visuals
        - Experiments
        - Physical Lab
        - Command line (run or sweep)
        - Installation or launcher
        - Other
  - type: dropdown
    id: provider
    attributes:
      label: Which agent provider?
      options:
        - Mock / No model
        - LocalDeploy
        - OpenAI-compatible endpoint
        - Not relevant
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, or Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error
      description: The terminal output of the server helps most. Remove API keys, private prompts, and local paths.
      render: text
